name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  uv-release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Force branch to workflow commit
        run: git reset --hard ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project dependencies
        run: uv sync --locked --all-extras

      - name: Create release version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release version --push --vcs-release --changelog
          # HEAD only gets a tag when a new version was released (docs/chore commits don't bump)
          if [ -n "$(git tag --points-at HEAD)" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build distributions
        if: steps.release.outputs.released == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        run: uv publish --trusted-publishing always

      - name: Publish to GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release publish
